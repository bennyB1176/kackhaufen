<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8fd3ff" />
    <title>Kackhaufen fangen! 💩</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="start-screen">
      <h1>Kackhaufen fangen!</h1>
      <p>Tippe den laufenden Kackhaufen an, so schnell du kannst! Du hast 60 Sekunden.</p>
      <p>Treffer in Folge geben Extra-Punkte. Fang den stinkigen Kapitän 🧢 für einen dicken Bonus!</p>
      <button id="start-button" type="button">Los geht's!</button>
      <p class="hint">Am besten im Querformat 🔄</p>
    </div>

    <div id="gameover-screen" class="hidden">
      <div id="new-record" class="hidden">🏆 Platz 1! 🏆</div>
      <h1>Zeit um! ⏱️</h1>
      <p class="big">Punkte: <span id="final-score">0</span></p>

      <div id="name-entry" class="hidden">
        <label for="name-input">Trag deinen Namen ein!</label>
        <div class="row">
          <input
            id="name-input"
            type="text"
            maxlength="12"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
            placeholder="Dein Name"
          />
          <button id="save-name-button" type="button">Eintragen</button>
        </div>
      </div>

      <ol id="highscore-list"></ol>
      <button id="restart-button" type="button">Nochmal!</button>
    </div>

    <div id="rotate-hint">
      <div class="emoji">📱</div>
      <h1>Bitte dreh dein Handy quer! 🔄</h1>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
